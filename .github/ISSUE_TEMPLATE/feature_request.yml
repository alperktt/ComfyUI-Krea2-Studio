name: Feature request
description: Something the node should do, or do differently.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or workflow you're stuck on — not yet the solution. "I want to reuse the sound of a render without re-attaching it" beats "add a button".
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: How do you imagine it working?
      description: Where would it live (a pill, the rail, the picker, Refine, …) and what would it do? Sketches and screenshots welcome.

  - type: textarea
    id: workaround
    attributes:
      label: What do you do today instead?
      description: Your current workaround, if any — it tells us how much the feature is worth.

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#1B222E"/>
      <stop offset="100%" stop-color="#0E1116"/>
    </radialGradient>
    <linearGradient id="clip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EBEFF"/>
      <stop offset="100%" stop-color="#2F7BF6"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#glow)"/>

  <!-- @ tail: bowl-right stem, hook, and the big sweep -->
